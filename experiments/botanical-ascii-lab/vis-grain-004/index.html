<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIS-GRAIN-004 · Pflanzensymbole</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    font-family: ui-monospace, Consolas, monospace;
    --page: #121613; --text: #eef1e6; --muted: #bdc8b6;
    --control: #252d25; --border: #657262; --card: #171d17;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #f5f5ed; --text: #202a1f; --muted: #435242;
    --control: #e5eadd; --border: #778471; --card: #fcfcf6;
  }
  body { margin: 0; background: var(--page); color: var(--text); }
  main { max-width: 1060px; margin: auto; padding: clamp(16px, 4vw, 48px); }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
  h1 { font-size: clamp(1.3rem, 3vw, 1.9rem); margin: 0; }
  p { color: var(--muted); line-height: 1.5; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  button, select { font: inherit; color: inherit; background: var(--control); padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  label { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  #plots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(285px, 100%), 1fr)); gap: 12px; margin-top: 24px; }
  figure { min-width: 0; margin: 0; border: 1px solid var(--border); background: var(--card); }
  canvas { width: 100%; height: 164px; display: block; }
  figcaption { padding: 10px 14px; border-top: 1px solid var(--border); }
</style>
<main>
  <header>
    <h1>Grainrad-Pflanzen im Gartenmaßstab</h1>
    <div class="controls">
      <label>Wachstumsphase
        <select id="growth" disabled>
          <option value="sprout">Klein</option>
          <option value="juvenile">Jungpflanze</option>
          <option value="developing">Herangewachsen</option>
          <option value="mature" selected>Ausgewachsen</option>
        </select>
      </label>
      <button id="theme" aria-pressed="false" disabled>Hellmodus</button>
      <button id="pause" disabled>Pausieren</button>
    </div>
  </header>
  <p id="status" role="status">Synthetische Testszene · Bildatlas wird geladen</p>
  <section id="plots" aria-label="Pflanzen nach Kultur"></section>
</main>
<script type="module" src="./demo.js"></script>
</html>
